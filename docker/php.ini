; PHP settings for the Cloud Run runtime.
; Loaded as conf.d/zz-app.ini so it wins over the distribution defaults.

[PHP]
; Loan documents are uploaded through POST /loan-detail/{id}/upload-documents,
; several files at a time. Keep nginx client_max_body_size >= post_max_size.
upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 20

; Per-request ceiling. Must stay below the Cloud Run request timeout so a stuck
; request is killed by PHP (producing a stack trace in the log) rather than by
; the platform (which tells you nothing about where it hung).
max_execution_time = 60
max_input_time = 60

; Per-worker memory. With a 512Mi container and 4 php-fpm workers this is a
; deliberate ceiling: 4 x 128M is still under budget even in the worst case,
; leaving room for nginx, supervisord and the OS. Raising this without also
; lowering pm.max_children in php-fpm.conf risks the container being OOM-killed.
memory_limit = 128M

; Never render a stack trace to the browser in production. Errors go to stderr,
; which Cloud Logging captures. APP_DEBUG in Laravel is a separate switch and
; must also be false.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0

; The image is immutable — source files cannot change while the container runs —
; so opcache never needs to stat them. This removes a filesystem check from every
; included file on every request. It is also why a code change requires a new
; image rather than a file copy.
opcache.validate_timestamps = 0

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Laravel reads doc comments at runtime for attribute/annotation-driven features;
; stripping them breaks those in subtle, hard-to-trace ways.
opcache.save_comments = 1

; Compile everything on the first request after boot instead of lazily. Costs a
; few hundred ms once per cold start and makes every subsequent request faster —
; a good trade on Cloud Run, where instances are short-lived.
opcache.file_cache = /tmp/opcache
opcache.file_cache_consistency_checks = 1
